<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XPS Glider · FPV Lab</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Sklandytuvas iš 5 mm XPS pakloto: 10 formų, skaičiavimas, 3D ir skrydžio modeliavimas. Планер из подложки XPS 5 мм.">
<style>
:root{--bg:#05090e;--bg2:#0a1118;--panel:#0d151e;--line:#1b2a3a;--neon:#35f2a1;--cyan:#3ad8ff;--warn:#ffb020;--bad:#ff4d5e;
--txt:#d9e4ef;--dim:#8193a6;--mono:"Cascadia Mono","Consolas","DejaVu Sans Mono","Menlo",monospace;--sans:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--cyan)}
h2{font:600 15px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--neon);margin:0 0 4px}
h2::before{content:"// ";color:var(--dim)}
.hint{color:var(--dim);font-size:14px;margin:0 0 18px}
section{max-width:1240px;margin:0 auto;padding:44px 20px 8px}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
#bar{position:fixed;z-index:30;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;
background:rgba(5,9,14,.84);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(27,42,58,.7);font-family:var(--mono)}
#dl .short{display:none}
#brand{font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--neon);white-space:nowrap}
#brand i{font-style:normal;color:var(--dim)}
#bar .sp{flex:1}
.btn{border:1px solid var(--line);background:rgba(13,21,30,.8);border-radius:6px;padding:7px 12px;font:600 12px var(--mono);letter-spacing:.06em;
color:var(--txt);text-decoration:none;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--neon);color:var(--neon)}
.btn.on{border-color:var(--neon);color:#04110b;background:var(--neon)}
.btn.accent{border-color:var(--cyan);color:var(--cyan)}
.btn.accent:hover{background:var(--cyan);color:#03131a}
.seg{display:flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg .btn:last-child{border-radius:0 6px 6px 0}

/* hero */
#hero{position:relative;height:100vh;min-height:600px;max-height:980px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0d1b29 0%,#05090e 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);color:var(--neon);text-shadow:0 0 8px rgba(53,242,161,.45)}
#hud .scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#hud .corner{position:absolute;width:34px;height:34px;border:2px solid rgba(53,242,161,.55)}
#hud .c1{left:14px;top:64px;border-right:0;border-bottom:0}#hud .c2{right:14px;top:64px;border-left:0;border-bottom:0}
#hud .c3{left:14px;bottom:86px;border-right:0;border-top:0}#hud .c4{right:14px;bottom:86px;border-left:0;border-top:0}
#titlebox{position:absolute;left:30px;top:78px;max-width:min(560px,70vw)}
#titlebox h1{margin:0;font:700 clamp(20px,3.2vw,36px)/1.15 var(--sans);color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.8)}
#titlebox p{margin:8px 0 0;color:var(--txt);font:400 clamp(13px,1.4vw,16px) var(--sans);text-shadow:0 1px 10px rgba(0,0,0,.9)}
#formtag{margin-top:12px;font-size:13px;letter-spacing:.1em;color:var(--cyan)}
#rec{position:absolute;right:30px;top:78px;font-size:12px;letter-spacing:.12em;text-align:right;color:var(--txt)}
#rec b{color:var(--bad);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.tape{position:absolute;top:50%;transform:translateY(-50%);width:132px;padding:10px 12px;border:1px solid rgba(53,242,161,.5);background:rgba(4,12,10,.35);backdrop-filter:blur(2px)}
.tape.l{left:30px}.tape.r{right:30px;text-align:right}
.tape small{display:block;font-size:10px;letter-spacing:.16em;color:var(--txt);opacity:.8}
.tape b{display:block;font-size:34px;line-height:1.05;font-weight:700}
.tape em{font-style:normal;font-size:11px;color:var(--txt);opacity:.8}
.tape .sub{margin-top:8px;border-top:1px dashed rgba(53,242,161,.4);padding-top:6px}
.tape .sub b{font-size:18px}
#horizon{position:absolute;left:50%;top:50%;width:min(46vh,42vw);height:min(46vh,42vw);transform:translate(-50%,-50%);opacity:.9}
#warn{position:absolute;left:50%;top:132px;transform:translateX(-50%);font-size:13px;letter-spacing:.2em;padding:5px 12px;border:1px solid currentColor;background:rgba(4,12,10,.5);white-space:nowrap}
#warn.bad{color:var(--bad);text-shadow:0 0 8px rgba(255,77,94,.6);animation:blink .7s steps(2) infinite}
#warn.mid{color:var(--warn);text-shadow:0 0 8px rgba(255,176,32,.5)}
#strip{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;gap:26px;font-size:12px;letter-spacing:.12em;white-space:nowrap}
#strip span{color:var(--txt);opacity:.8}#strip b{font-size:20px;margin-left:6px}
#orbithint{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);font-size:12px;letter-spacing:.1em;color:var(--txt);display:none}
#ctl{position:absolute;z-index:5;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 12px}
#hero.orbit .tape,#hero.orbit #horizon,#hero.orbit #strip,#hero.orbit #warn{display:none}
#hero.nohorizon #horizon{display:none}
#hero.orbit #orbithint{display:block}
#hero.orbit #titlebox p{display:none}

/* form cards */
#forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fc{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px 12px;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.fc:hover{transform:translateY(-3px);border-color:var(--cyan)}
.fc.on{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 26px rgba(53,242,161,.18)}
.fc svg{width:100%;height:120px;display:block}
.fc .id{font:600 11px var(--mono);letter-spacing:.14em;color:var(--dim)}
.fc .pk{position:absolute;top:9px;right:10px;font:700 10px var(--mono);letter-spacing:.1em;color:#04110b;background:var(--neon);padding:2px 7px;border-radius:4px}
.fc .nm{font-weight:600;font-size:16px;margin:2px 0}
.fc .kd{font-size:12px;color:var(--dim)}
.fc .nums{display:flex;gap:12px;margin-top:8px;font:600 13px var(--mono);color:var(--neon)}
.fc .nums i{font-style:normal;color:var(--dim);font-weight:400;margin-left:3px}
#why{margin:16px 0 0;padding:14px 16px;border-left:3px solid var(--neon);background:var(--bg2);border-radius:0 8px 8px 0;font-size:15px}

/* lab */
#lab{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px}
.card h3{margin:0 0 12px;font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.sl{margin-bottom:14px}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.sl output{font:600 13px var(--mono);color:var(--neon);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--neon);border:2px solid #04110b;box-shadow:0 0 10px rgba(53,242,161,.6)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--neon);border:2px solid #04110b}
#gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.g{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg2)}
.g small{display:block;font-size:12px;color:var(--dim);min-height:2.6em;line-height:1.3}
.g b{font:700 24px var(--mono);color:var(--txt)}
.g em{font-style:normal;font:400 12px var(--mono);color:var(--dim);margin-left:4px}
.g .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.g .bar i{display:block;height:100%;width:0;background:var(--neon);transition:width .2s,background .2s}
.g.mid b{color:var(--warn)}.g.mid .bar i{background:var(--warn)}
.g.bad b{color:var(--bad)}.g.bad .bar i{background:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.two svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
#status{margin-top:12px;font:600 12px var(--mono);letter-spacing:.14em}
#status.ok{color:var(--neon)}#status.mid{color:var(--warn)}#status.bad{color:var(--bad)}

/* compare */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 12px;text-align:right;border-bottom:1px solid rgba(27,42,58,.6);font-family:var(--mono)}
td:first-child{font-family:var(--sans);font-weight:600}
tbody tr{cursor:pointer}tbody tr:hover{background:rgba(58,216,255,.06)}
tbody tr.on{background:rgba(53,242,161,.09)}tbody tr.on td:first-child{color:var(--neon)}
td .rb{display:inline-block;height:6px;background:var(--neon);border-radius:3px;vertical-align:middle;margin-right:8px;opacity:.85}

/* lesson */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ls{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px}
.ls b{display:block;font-size:16px;margin-bottom:6px;color:#fff}
.ls .n{font:700 12px var(--mono);color:var(--neon);letter-spacing:.14em}
.ls p{margin:0;font-size:15px;color:var(--txt)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;position:relative;padding:12px 14px 12px 54px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:14px;top:11px;font:700 18px var(--mono);color:var(--neon)}
ul.trim{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.trim li{padding:10px 14px;border-left:3px solid var(--warn);background:var(--bg2);border-radius:0 8px 8px 0}
.note{font-size:14px;color:var(--dim)}
#src a{display:block;padding:5px 0;text-decoration:none;font-size:14px}
#src a:hover{text-decoration:underline}
footer{max-width:1240px;margin:0 auto;padding:36px 20px 60px;color:var(--dim);font:400 12px var(--mono);letter-spacing:.06em}

@media (max-width:900px){#lab,.two{grid-template-columns:1fr}.tape{width:104px;padding:8px}.tape b{font-size:24px}.tape.l{left:12px}.tape.r{right:12px}
#titlebox{left:16px;top:64px}#rec{display:none}#strip{gap:12px;font-size:10px}#strip b{font-size:15px}#brand i{display:none}
#horizon{width:min(40vh,56vw);height:min(40vh,56vw)}}
@media (max-width:900px){#titlebox p{display:none}#warn{top:auto;bottom:132px;font-size:11px;padding:4px 9px}}
@media (max-width:560px){#bar{gap:6px;padding:0 8px}.btn{padding:6px 8px;font-size:11px}#strip span.opt{display:none}
#dl .long{display:none}#dl .short{display:inline}#pdf,#repo{display:none}
.tape{top:150px;transform:none;width:88px;padding:6px 8px;background:rgba(4,12,10,.2)}.tape b{font-size:20px}.tape .sub{display:none}
#hud .c1,#hud .c2{top:58px}#titlebox h1{font-size:19px}#strip{bottom:104px}#ctl{bottom:14px;gap:6px}}
</style>
</head>
<body>
<div id="bar">
  <div id="brand">XPS GLIDER <i>// FPV LAB</i></div>
  <div class="sp"></div>
  <a class="btn" id="repo" target="_blank" rel="noopener" hidden>GitHub</a>
  <a class="btn" id="pdf" target="_blank" rel="noopener" data-i18n="pdf" hidden></a>
  <button class="btn accent" id="dl">⬇ <span class="long" data-i18n="download"></span><span class="short">HTML</span></button>
  <div class="seg" id="lang"><button class="btn" data-lang="lt">LT</button><button class="btn" data-lang="ru">RU</button></div>
</div>

<div id="hero">
  <canvas id="gl"></canvas>
  <div id="hud">
    <div class="scan"></div>
    <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
    <div id="titlebox"><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p><div id="formtag"></div></div>
    <div id="rec"><b>●</b> REC <span id="clock">00:00.00</span><br><span id="modetag">CHASE</span></div>
    <div id="warn"></div>
    <div class="tape l"><small data-i18n="h_speed"></small><b id="hV">0.0</b><em>m/s</em>
      <div class="sub"><small data-i18n="h_aoa"></small><b id="hA">0.0</b><em>°</em></div></div>
    <div class="tape r"><small data-i18n="h_alt"></small><b id="hH">0.00</b><em>m</em>
      <div class="sub"><small data-i18n="h_vs"></small><b id="hS">0.00</b><em>m/s</em></div></div>
    <svg id="horizon" viewBox="-100 -100 200 200" aria-hidden="true">
      <defs><clipPath id="hc"><circle r="92"/></clipPath></defs>
      <g clip-path="url(#hc)"><g id="ladder"></g></g>
      <circle r="92" fill="none" stroke="currentColor" stroke-opacity=".35"/>
      <g stroke="currentColor" stroke-width="2.2" fill="none"><path d="M-46 0h-22M46 0h22M-14 0l14 9l14-9"/></g>
      <g id="fpm" stroke="#3ad8ff" stroke-width="1.6" fill="none"><circle r="5"/><path d="M-13 0h-8M13 0h8M0-5v-6"/></g>
    </svg>
    <div id="strip">
      <div><span data-i18n="h_dist"></span><b id="hL">0.00</b> m</div>
      <div><span data-i18n="h_time"></span><b id="hT">0.00</b> s</div>
      <div><span class="opt" data-i18n="h_ld"></span><b id="hK">0.0</b></div>
      <div><span class="opt" data-i18n="h_pitch"></span><b id="hP">0.0</b>°</div>
    </div>
    <div id="orbithint" data-i18n="orbit_hint"></div>
  </div>
  <div id="ctl">
    <div class="seg" id="modes">
      <button class="btn" data-mode="fpv" data-i18n="m_fpv"></button>
      <button class="btn" data-mode="chase" data-i18n="m_chase"></button>
      <button class="btn" data-mode="side" data-i18n="m_side"></button>
      <button class="btn" data-mode="orbit" data-i18n="m_orbit"></button>
    </div>
    <button class="btn accent" id="throw">▶ <span data-i18n="play"></span></button>
    <button class="btn" id="slow"></button>
  </div>
</div>

<section>
  <h2 data-i18n="s_forms"></h2><p class="hint" data-i18n="s_forms_hint"></p>
  <div id="forms"></div>
  <div id="why"></div>
</section>

<section>
  <h2 data-i18n="s_lab"></h2><p class="hint" data-i18n="s_lab_hint"></p>
  <div id="lab">
    <div class="card">
      <div class="sl"><label><span data-i18n="c_size"></span><output id="oSize"></output></label><input type="range" id="iSize" min="0.7" max="3" step="0.02" value="1"></div>
      <div class="sl"><label><span data-i18n="c_areal"></span><output id="oAreal"></output></label><input type="range" id="iAreal" min="100" max="300" step="5" value="165"></div>
      <div class="sl"><label><span data-i18n="c_ballast"></span><output id="oBal"></output></label><input type="range" id="iBal" min="0" max="250" step="1" value="100"></div>
      <div class="sl"><label><span data-i18n="c_elev"></span><output id="oEl"></output></label><input type="range" id="iEl" min="-14" max="14" step="0.2" value="0"></div>
      <div class="sl"><label><span data-i18n="c_v0"></span><output id="oV0"></output></label><input type="range" id="iV0" min="50" max="220" step="1" value="100"></div>
      <div class="sl"><label><span data-i18n="c_ang"></span><output id="oAng"></output></label><input type="range" id="iAng" min="-40" max="40" step="1" value="0"></div>
      <div class="sl"><label><span data-i18n="c_h0"></span><output id="oH0"></output></label><input type="range" id="iH0" min="0.5" max="3" step="0.05" value="1.6"></div>
      <button class="btn" id="reset" data-i18n="c_reset"></button>
      <div id="status"></div>
    </div>
    <div>
      <div id="gauges"></div>
      <div class="two">
        <div class="card"><h3 data-i18n="tr_title"></h3><svg id="traj" viewBox="0 0 520 250"></svg>
          <div class="legend"><span><i style="background:#35f2a1"></i><span data-i18n="tr_now"></span></span><span><i style="background:#8193a6"></i><span data-i18n="tr_auto"></span></span></div></div>
        <div class="card"><h3 data-i18n="bal_title"></h3><svg id="bal" viewBox="0 0 520 250"></svg>
          <div class="legend"><span><i style="background:#35f2a1"></i><span data-i18n="bal_cg"></span></span><span><i style="background:#3ad8ff"></i><span data-i18n="bal_np"></span></span><span><i style="background:#ffb020"></i><span data-i18n="bal_b"></span></span></div>
          <p class="note" data-i18n="bal_rule" style="margin:8px 0 0"></p></div>
      </div>
    </div>
  </div>
</section>

<section>
  <h2 data-i18n="s_cmp"></h2><p class="hint" data-i18n="s_cmp_hint"></p>
  <div class="tw"><table><thead><tr>
    <th data-i18n="t_form"></th><th data-i18n="t_mass"></th><th data-i18n="t_ball"></th><th data-i18n="t_v"></th><th data-i18n="t_ld"></th>
    <th data-i18n="t_sink"></th><th data-i18n="t_range"></th><th data-i18n="t_time"></th></tr></thead><tbody id="cmp"></tbody></table></div>
</section>

<section>
  <h2 data-i18n="s_why"></h2><p class="hint"></p>
  <div class="grid3">
    <div class="ls"><span class="n">01</span><b data-i18n="w1_t"></b><p data-i18n="w1"></p></div>
    <div class="ls"><span class="n">02</span><b data-i18n="w2_t"></b><p data-i18n="w2"></p></div>
    <div class="ls"><span class="n">03</span><b data-i18n="w3_t"></b><p data-i18n="w3"></p></div>
    <div class="ls"><span class="n">04</span><b data-i18n="w4_t"></b><p data-i18n="w4"></p></div>
    <div class="ls"><span class="n">05</span><b data-i18n="w5_t"></b><p data-i18n="w5"></p></div>
    <div class="ls"><span class="n">06</span><b data-i18n="w6_t"></b><p data-i18n="w6"></p></div>
  </div>
</section>

<section>
  <h2 data-i18n="s_build"></h2><p class="hint"></p>
  <ol class="steps"><li data-i18n="b1"></li><li data-i18n="b2"></li><li data-i18n="b3"></li><li data-i18n="b4"></li><li data-i18n="b5"></li><li data-i18n="b6"></li></ol>
</section>

<section>
  <h2 data-i18n="s_trim"></h2><p class="hint"></p>
  <ul class="trim"><li data-i18n="tr1"></li><li data-i18n="tr2"></li><li data-i18n="tr3"></li></ul>
  <h2 data-i18n="s_exp" style="margin-top:34px"></h2>
  <p data-i18n="exp" style="margin:8px 0 0"></p>
</section>

<section>
  <h2 data-i18n="s_method"></h2>
  <p class="note" data-i18n="method" style="margin:8px 0 22px;max-width:920px"></p>
  <h2 data-i18n="s_src"></h2>
  <div id="src"></div>
  <div id="open" hidden style="margin-top:26px"><h2 data-i18n="s_open"></h2>
    <p style="margin:8px 0 0"><span data-i18n="open"></span> <a id="repo2" target="_blank" rel="noopener"></a></p></div>
</section>
